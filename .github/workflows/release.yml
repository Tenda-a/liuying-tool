name: Build and release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build signed test APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: bash build.sh

      - name: Prepare release files
        run: |
          cp build/outputs/liuying-video.apk liuying-video.apk
          sha256sum liuying-video.apk > liuying-video.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose liuying-video.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            liuying-video.apk \
            liuying-video.apk.sha256 \
            --title "流影下载器 ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md

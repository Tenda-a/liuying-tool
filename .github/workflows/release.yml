name: Build and release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build signed test APK
        id: build
        continue-on-error: true
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build-output.log

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo '## Android build failed'
            echo '```text'
            tail -100 build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          last_line=$(tail -1 build-output.log | sed 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error file=build.sh,line=1,title=Android build failed::$last_line"
          exit 1

      - name: Prepare release files
        run: |
          cp build/outputs/liuying-video.apk liuying-video.apk
          sha256sum liuying-video.apk > liuying-video.apk.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            liuying-video.apk \
            liuying-video.apk.sha256 \
            --title "流影下载器 ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
